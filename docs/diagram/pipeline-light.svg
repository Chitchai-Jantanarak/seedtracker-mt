<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 824 72" width="824" height="72" role="img" aria-labelledby="seedtracker-pipeline-light-title seedtracker-pipeline-light-desc" font-family="Inter, Geist, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="seedtracker-pipeline-light-title">How seedtracker finds a seed</title>
