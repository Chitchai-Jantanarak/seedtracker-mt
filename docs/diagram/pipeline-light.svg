  </defs>
  <rect width="824" height="72" fill="#ffffff"/>
  <line x1="140" y1="36" x2="178" y2="36" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#seedtracker-pipeline-light-a)"/>
  <line x1="308" y1="36" x2="346" y2="36" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#seedtracker-pipeline-light-a)"/>
  <line x1="476" y1="36" x2="514" y2="36" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#seedtracker-pipeline-light-a)"/>
  <line x1="644" y1="36" x2="682" y2="36" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#seedtracker-pipeline-light-a)"/>
  <rect x="12" y="16" width="128" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
  <text x="76" y="41" fill="#2d3142" font-size="14" font-weight="700" text-anchor="middle">Seed</text>
