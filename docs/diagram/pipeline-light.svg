  <text x="244" y="41" fill="#2d3142" font-size="14" font-weight="700" text-anchor="middle">std::mt19937</text>
  <rect x="348" y="16" width="128" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2" stroke-dasharray="6,4"/>
  <text x="412" y="41" fill="#2d3142" font-size="14" font-weight="700" text-anchor="middle">RULES</text>
  <rect x="516" y="16" width="128" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
